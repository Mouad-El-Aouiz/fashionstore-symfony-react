databases:
  - name: fashionstore-demo-db
    databaseName: fashionstore
    user: fashionstore
    plan: free
    ipAllowList: []

services:
  - type: web
    name: fashionstore-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.production
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: SEED_DEMO_CATALOG
        value: "true"
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: fashionstore-demo-db
          property: connectionString
      - key: CORS_ALLOW_ORIGIN
        value: "^https://fashionstore-demo\\.onrender\\.com$"
      - key: DEFAULT_URI
        value: https://fashionstore-demo.onrender.com
      - key: FRONTEND_URL
        value: https://fashionstore-demo.onrender.com
      - key: JWT_SECRET_KEY
        value: /app/config/jwt/private.pem
      - key: JWT_PUBLIC_KEY
        value: /app/config/jwt/public.pem
      - key: JWT_PASSPHRASE
        sync: false
      - key: JWT_SECRET_KEY_CONTENT
        sync: false
      - key: JWT_PUBLIC_KEY_CONTENT
        sync: false
      - key: MAILER_DSN
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: TRUSTED_PROXIES
        value: REMOTE_ADDR
